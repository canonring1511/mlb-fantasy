services:
  - type: web
    name: mlb-fantasy-api
    runtime: python
    rootDir: MLB_fantasy_api
    buildCommand: apt-get install -y tesseract-ocr && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # set this in Render dashboard
      - key: ALLOWED_ORIGINS
        value: https://your-netlify-app.netlify.app  # update after Netlify deploy
    plan: free
